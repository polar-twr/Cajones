    <script>
      (function () {
        try {
          var stored = localStorage.getItem('leitner_local_v1');
          var theme = null;
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light')) {
              theme = parsed.theme;
            }
          }
          if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0E1013');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="notranslate bg-[#F8F8F6] text-zinc-900 dark:bg-[#0E1013] dark:text-zinc-100 antialiased selection:bg-blue-600/20 selection:text-blue-700 dark:selection:text-blue-300">
